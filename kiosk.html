<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03264b">
  <meta name="description" content="Explore HFGC Hospitality Ministry. Welcome, honor, serve and care. Find your place to serve at HFGC EXPO 2026.">
  <title>HFGC EXPO 2026 · Hospitality Ministry</title>
  <link rel="icon" type="image/png" href="pmcc_logo_icon.png">
  <link rel="apple-touch-icon" href="pmcc_logo_icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portrait.css?v=emoji-20261005">
  <script defer src="config.js?v=signup-20261002"></script>
  <link rel="stylesheet" href="registration.css?v=20261005">
  <script defer src="signups.js?v=20261005"></script>
  <script defer src="app.js?v=emoji-20261005"></script>
</head>
<body>
  <div id="intro" class="intro" aria-label="Welcome to HFGC EXPO 2026">
    <div class="intro-orbit orbit-one" aria-hidden="true"></div>
    <div class="intro-orbit orbit-two" aria-hidden="true"></div>
    <div class="intro-orbit orbit-three" aria-hidden="true"></div>
    <div class="intro-content">
      <h1 class="intro-heading">WHO WE ARE</h1>
      <div class="logo-reveal"><img src="HFGC%20EXPO%20GOLD%20FLAT%20LOGO.png" alt="HFGC EXPO 2026" width="956" height="561"></div>
      <p class="intro-subtitle">HOSPITALITY MINISTRY</p>
      <nav class="intro-menu" aria-label="Explore Hospitality">
        <button type="button" data-intro-page="heart"><img class="intro-emoji" data-emoji="heart" src="assets/emoji/heart.svg" width="43" height="43" alt="" aria-hidden="true"><span>Our Heart</span><span class="intro-arrow" aria-hidden="true">›</span></button>
        <button type="button" data-intro-page="general"><img class="intro-emoji" data-emoji="serve" src="assets/emoji/serve.svg" width="43" height="43" alt="" aria-hidden="true"><span>What We Do</span><span class="intro-arrow" aria-hidden="true">›</span></button>
        <button type="button" data-intro-page="vip"><img class="intro-emoji" data-emoji="honor" src="assets/emoji/honor.svg" width="43" height="43" alt="" aria-hidden="true"><span>VIP Hospitality</span><span class="intro-arrow" aria-hidden="true">›</span></button>
        <button type="button" data-intro-page="join"><img class="intro-emoji" data-emoji="care" src="assets/emoji/care.svg" width="43" height="43" alt="" aria-hidden="true"><span>Get Involved</span><span class="intro-arrow" aria-hidden="true">›</span></button>
      </nav>
      <button id="enter" class="intro-enter" type="button">TOUCH TO EXPLORE <span class="touch-mark" aria-hidden="true">↓</span></button>
    </div>
    <p class="intro-caption">WELCOME · HONOR · SERVE · CARE</p>
  </div>
  <div id="experience" class="experience" inert>
    <header class="topbar">
      <button class="brand" data-page="home" aria-label="HFGC Hospitality Ministry home">
        <img src="HFGC%20EXPO%20GOLD%20FLAT%20LOGO.png" alt="HFGC EXPO 2026" width="956" height="561">
        <span>HOSPITALITY<br><strong>MINISTRY</strong></span>
      </button>
      <nav aria-label="Main navigation" id="main-nav">
        <button data-page="heart">Our Heart</button>
        <button data-page="general">What We Do</button>
        <button data-page="vip">VIP Hospitality</button>
        <button data-page="teams">Our Teams</button>
        <button data-page="join" class="nav-join">Join Us</button>
      </nav>
      <button id="fullscreen" class="icon-button" aria-label="Enter full screen" title="Full screen"></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="bottom-bar">
      <button data-page="home" class="home-button" id="home-button"></button>
      <p>WELCOME <span>·</span> HONOR <span>·</span> SERVE <span>·</span> CARE</p>
      <button id="restart" class="text-button">Start Over</button>
    </footer>
  </div>
  <dialog id="idle-dialog" class="idle-dialog" aria-labelledby="idle-title">
    <div class="idle-icon" aria-hidden="true">✦</div>
    <p class="eyebrow">TAKE YOUR TIME</p>
    <h2 id="idle-title">Still exploring?</h2>
    <p>We’ll return to the welcome screen in <strong id="idle-count">15</strong> seconds.</p>
    <div class="actions"><button id="continue" class="btn primary">Continue Exploring</button><button id="idle-home" class="btn secondary">Return to Home</button></div>
  </dialog>
  <noscript>This interactive experience needs JavaScript. Please enable it in this browser.</noscript>
</body>
</html>
